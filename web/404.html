<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#080a0d">
  <title>404 — Vyline</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#080a0d;color:#f4f6f8;font-family:Inter,"Noto Sans JP","Yu Gothic UI",Meiryo,system-ui,sans-serif}body{min-height:100vh;display:grid;place-items:center;padding:32px;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:64px 64px}main{width:min(720px,100%)}.code{margin:0 0 20px;color:#d6ff32;font:12px/1.4 Consolas,monospace;letter-spacing:.08em}.title{margin:0;font-size:clamp(72px,18vw,160px);line-height:.8;letter-spacing:-.07em}.copy{max-width:560px;margin:28px 0;color:#a4abb3;font-size:16px;line-height:1.7}nav{display:flex;gap:10px;flex-wrap:wrap}a{padding:11px 15px;border:1px solid rgba(255,255,255,.22);color:#fff;text-decoration:none;font-size:13px;font-weight:670}a.primary{border-color:#f4f6f8;background:#f4f6f8;color:#0b0d0f}a:hover{border-color:#fff}
  </style>
</head>
<body>
  <main>
    <p class="code">HTTP 404</p>
    <h1 class="title">Not found.</h1>
    <p class="copy">この URL にページはありません。トップページかドキュメントから目的のページを開いてください。</p>
    <nav>
      <a class="primary" data-home href="/">Vyline</a>
      <a data-docs href="/docs/">Docs</a>
      <a href="https://github.com/tqmane/vyline">GitHub ↗</a>
    </nav>
  </main>
  <script>
    (() => {
      const parts = location.pathname.split("/").filter(Boolean);
      const base = location.hostname.endsWith("github.io") && parts.length ? `/${parts[0]}/` : "/";
      document.querySelector("[data-home]").href = base;
      document.querySelector("[data-docs]").href = `${base}docs/`;
    })();
  </script>
</body>
</html>
