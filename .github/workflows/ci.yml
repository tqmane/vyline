name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

jobs:
  documentation:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - run: bun run docs:readme:check
      - run: node scripts/verify-release-architecture.mjs

  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - run: bun install
      - run: bun run typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - run: bun install
      - run: bun run lint

  docker-build:
    name: Docker build + runtime smoke
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build CI image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: vyline:ci
          cache-from: type=gha,scope=ci-docker
          cache-to: type=gha,mode=max,scope=ci-docker
          provenance: false
          sbom: false

      - name: Verify container startup
        shell: bash
        run: |
          set -euo pipefail
          container_id="$(docker run -d -p 127.0.0.1:3000:3000 vyline:ci)"
          trap 'docker rm -f "$container_id" >/dev/null 2>&1 || true' EXIT
          healthy=false
          for _ in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/healthz >/dev/null; then
              healthy=true
              break
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' "$container_id")" != "true" ]; then
              echo "Container exited during startup"
              docker logs "$container_id"
              exit 1
            fi
            sleep 1
          done
          if [ "$healthy" != "true" ]; then
            echo "Health check timed out"
            docker logs "$container_id"
            exit 1
          fi

          pid1_uid="$(docker exec "$container_id" sh -c "awk '/^Uid:/ { print \$2 }' /proc/1/status")"
          if [ "$pid1_uid" = "0" ]; then
            echo "Vyline runtime is still running as root"
            docker logs "$container_id"
            exit 1
          fi
